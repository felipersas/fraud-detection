[project]
name = "fraud-core"
version = "0.1.0"
description = "Feature engineering shared by model training and serving, so both transform transactions identically."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
