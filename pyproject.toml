[project]
name = "fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection: model training and serving, in one uv workspace."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["fraud-api", "fraud-core", "fraud-training"]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1",
    "ruff>=0.17.2",
]

[tool.uv]
# The root only ties the workspace together; it is not a package itself.
package = false

[tool.uv.workspace]
members = ["api", "packages/fraud-core", "training"]

[tool.uv.sources]
fraud-api = { workspace = true }
fraud-core = { workspace = true }
fraud-training = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["api/tests", "packages/fraud-core/tests", "training/tests"]
# Test files in different packages may share a name; importlib mode keeps them apart.
addopts = "--import-mode=importlib"
filterwarnings = [
    # Raised inside Keras's own ONNX exporter, not by this project's code.
    "ignore:In the future `np.object`:FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Notebooks are documents with outputs; reformatting them would churn every cell.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, modern syntax, likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_api", "fraud_core", "fraud_training"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
